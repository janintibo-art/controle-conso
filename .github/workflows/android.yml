name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check Android SDK on GitHub runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK for download
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk controle-conso.apk
          sha256sum controle-conso.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: controle-conso-apk
          path: controle-conso.apk
          if-no-files-found: error
      - name: Publish APK in GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest controle-conso.apk SHA256SUMS.txt --clobber
          else
            gh release create latest controle-conso.apk SHA256SUMS.txt --title "Contrôle Conso — APK Android" --notes "Version de test Android. APK signée avec une clé de débogage ; prévoir une clé permanente pour les versions stables." --target "$GITHUB_SHA" --latest
          fi
