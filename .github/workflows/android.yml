name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
      - name: Build debug APK (installable)
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: controle-conso-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest APK for website
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk controle-conso.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest controle-conso.apk --title "Contrôle Conso - dernière APK" --notes "Version de développement, APK signé avec une clé de débogage (installation pour tests)." --target "$GITHUB_SHA"
